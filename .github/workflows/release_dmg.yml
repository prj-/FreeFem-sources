# Build and package a macOS .dmg release artifact
name: Release .dmg

on:
  workflow_call:
    inputs:
      release_version:
        description: 'Release version number'
        required: true
        type: string
      macos_versions:
        description: 'macOS versions as JSON array'
        required: true
        type: string

jobs:
  package_freefem_macos:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        macos_version: ${{ fromJSON(inputs.macos_versions || '[15]') }}
    runs-on: macos-${{ matrix.macos_version }}
    steps:
      - uses: actions/checkout@v6

      # Remove homebrew LLVM compiler, and use most recent Xcode development
      # tools
      - name: Set environment
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          if (( ${{ matrix.macos_version }} == 15 )); then
            echo "LLVM_VERSION=18" >> $GITHUB_ENV
          elif (( ${{ matrix.macos_version }} == 14 )); then
            echo "LLVM_VERSION=15" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: |
          brew install m4 bison autoconf automake
          if (( ${{ matrix.macos_version }} != 26 )); then
            brew remove llvm@$LLVM_VERSION
          fi

      - name: Symlink gfortran
        run: ./etc/actions/macos/link_fortran.sh "$(uname -p)"

      - name: Configure
        run: |
          autoreconf -i
          ./configure --enable-optim --enable-generic \
          --prefix="/Applications/FreeFem++.app/Contents/ff-${{ inputs.release_version }}" \
          --enable-download

      - name: Build
        run: make -j 3

      - name: Build macOS app bundle
        run: make FreeFem++.app.tgz

      - name: Package .dmg
        run: |
          DMG_NAME="FreeFEM-${{ inputs.release_version }}-macos${{ matrix.macos_version }}.dmg"
          mkdir -p dmg_root
          tar xzf FreeFem++.app.tgz -C dmg_root
          cp bin/script/Install-app.sh dmg_root/
          hdiutil create \
            -srcfolder dmg_root \
            -fs HFS+ \
            "$DMG_NAME"

      - name: Upload .dmg as artifact
        uses: actions/upload-artifact@v7
        with:
          name: v${{ inputs.release_version }}-macOS-${{ matrix.macos_version }}
          path: ./*.dmg
